  <rect x="444" y="590" width="720" height="270" rx="14" fill="url(#ragCardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="472" y="626" fill="#ec4899" font-size="12" font-weight="600" letter-spacing="1">PHOENIX AI OBSERVABILITY</text>
  
  <rect x="472" y="646" width="664" height="190" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="496" y="678" fill="#10b981" font-size="12" font-mono="true">✓ Trace #phx-91823: Faithfulness Score 0.96 (Threshold &gt; 0.85)</text>
  <text x="496" y="704" fill="#38bdf8" font-size="12" font-mono="true">→ Retrieval Context: 8 relevant catalog products fetched in 42ms</text>
  <text x="496" y="730" fill="#94a3b8" font-size="12" font-mono="true">→ Context Precision: 0.91 • Context Recall: 0.89</text>
  <text x="496" y="756" fill="#fde047" font-size="12" font-mono="true">→ LLM Token Usage: 1,120 prompt tokens | 240 completion tokens</text>
  <text x="496" y="782" fill="#10b981" font-size="12" font-mono="true">→ Response verified: No ungrounded pricing or dimension claims</text>

  <!-- Right Card: Latency & Telemetry -->
  <rect x="1184" y="96" width="376" height="764" rx="14" fill="url(#ragCardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="1212" y="136" fill="#ec4899" font-size="12" font-weight="600" letter-spacing="1">LLMOPS METRICS</text>
  <text x="1212" y="166" fill="#ffffff" font-size="22" font-weight="700">Cluster Telemetry</text>

  <rect x="1212" y="200" width="320" height="120" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="1232" y="234" fill="#94a3b8" font-size="12">Average Query Latency</text>
  <text x="1232" y="272" fill="#38bdf8" font-size="32" font-weight="800">185 ms</text>
  <text x="1500" y="272" text-anchor="end" fill="#10b981" font-size="12">P95: 310ms</text>

  <rect x="1212" y="336" width="320" height="496" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="1232" y="372" fill="#ffffff" font-size="16" font-weight="600">Evaluated Query Categories</text>
  
  <rect x="1232" y="394" width="280" height="64" rx="8" fill="#162035"/>
  <text x="1248" y="422" fill="#ffffff" font-size="13" font-weight="600">Product Dimension Queries</text>
  <text x="1248" y="442" fill="#10b981" font-size="11">99.4% Precision • 0 hallucination</text>

  <rect x="1232" y="470" width="280" height="64" rx="8" fill="#162035"/>
  <text x="1248" y="498" fill="#ffffff" font-size="13" font-weight="600">Compatibility Comparisons</text>
  <text x="1248" y="518" fill="#10b981" font-size="11">96.8% Precision • Multi-hop</text>

  <rect x="1232" y="546" width="280" height="64" rx="8" fill="#162035"/>
  <text x="1248" y="574" fill="#ffffff" font-size="13" font-weight="600">Returns &amp; Warranty Policies</text>
  <text x="1248" y="594" fill="#10b981" font-size="11">100% Policy Compliance</text>
</svg>
