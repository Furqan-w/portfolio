  <text x="845" y="295" text-anchor="middle" fill="#64748b" font-size="10">top-k</text>

  <!-- Node 3 -->
  <rect x="870" y="270" width="150" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="945" y="302" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Query Evaluator</text>
  <text x="945" y="322" text-anchor="middle" fill="#10b981" font-size="10">Confidence Score: 0.94</text>

  <!-- Cyclic Loop Line -->
  <path d="M 945 270 C 945 220, 750 220, 750 265" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="848" y="235" text-anchor="middle" fill="#ec4899" font-size="10">Self-Correction Reformulation</text>

